<script>

	// 설정 메타데이터
	var configKeys = [
	//{ key:'maxmemory',            category:'Memory',      description:'최대 메모리 사용량 (바이트)',           dataType:'number' },
	//{ key:'maxmemory-policy',     category:'Memory',      description:'메모리 초과 시 키 삭제 정책',           dataType:'dropdown', options:['noeviction','allkeys-lru','volatile-lru','volatile-random'] },

	//{ key:'timeout',              category:'Client',      description:'유휴 클라이언트 연결 종료 시간(초)',     dataType:'number' },

	//{ key:'appendfsync',          category:'Persistence', description:'AOF 동기화 정책',                      dataType:'dropdown', options:['always','everysec','no'] },
	//{ key:'tcp-keepalive',        category:'Network',     description:'TCP keepalive 시간(초)',               dataType:'number' },

	//{ key:'logfile',              category:'Logging',     description:'로그 파일 경로',                       dataType:'text' },
	//{ key:'cluster-enabled',      category:'Cluster',     description:'클러스터 모드 사용 여부',               dataType:'toggle' },
	//{ key:'cluster-node-timeout', category:'Cluster',     description:'클러스터 노드 타임아웃(밀리초)',         dataType:'number' }
	];

	var tableBody = document.querySelector("#configTable tbody");
	var editModal  = new bootstrap.Modal(document.getElementById("editModal"));
    var loginModal = new bootstrap.Modal(document.getElementById("loginModal"), {
        backdrop: 'static' // 바깥 클릭해도 닫히지 않음
    });
    var currentEdit = null;
	var kvMap = {};
	var editEventObject = null; //클릭 이벤트 객체

    function normalizeRedisMemoryValue(value) {
        var text = value === null || value === undefined ? "" : String(value).trim();
        var mixed = text.endsWith("(+)");
        if (mixed) {
            text = text.slice(0, -3).trim();
        }

        if (/^\d+$/.test(text)) {
            var bytes = BigInt(text);
            var units = [
                { suffix: "gb", bytes: 1073741824n },
                { suffix: "g", bytes: 1000000000n },
                { suffix: "mb", bytes: 1048576n },
                { suffix: "m", bytes: 1000000n },
                { suffix: "kb", bytes: 1024n },
                { suffix: "k", bytes: 1000n }
            ];

            if (bytes === 0n) {
                text = "0";
            } else {
                for (var i = 0; i < units.length; i++) {
                    if (bytes >= units[i].bytes && bytes % units[i].bytes === 0n) {
                        text = `${bytes / units[i].bytes}${units[i].suffix}`;
                        break;
                    }
                }
            }
        }

        return { value: text.toLowerCase(), mixed: mixed };
    }

    function getRedisMemoryInputValue(value) {
        return normalizeRedisMemoryValue(value).value;
    }

    function formatRedisMemoryValue(value) {
        var normalized = normalizeRedisMemoryValue(value);
        if (!normalized.value) {
            return "-";
        }
        return normalized.value + (normalized.mixed ? " (+)" : "");
    }

    function formatConfigValue(config, value) {
        return config.dataType === "memoryunit" ? formatRedisMemoryValue(value) : value;
    }
    
	// 테이블 렌더링
	function renderTable(category="All", filter="") {
        tableBody.innerHTML = "";

        if (!configKeys || configKeys.length === 0) {
            initTable();
        } else {
            configKeys.filter(i => (category==="All" || i.category===category) && (i.key.includes(filter) || i.description.includes(filter)))
                    .forEach(i => {
                    var tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${i.key}</td>
                        <td><span class="current-value" data-key="${i.key}">${formatConfigValue(i, i.currentValue)}</span></td>
                        <td><button class="btn btn-sm btn-outline-primary edit-btn" data-key="${i.key}" data-cat="${i.category}">✏️</button></td>
                        <td>${i.description}</td>
                        `;
                    tableBody.appendChild(tr);
                    });
            document.querySelectorAll(".edit-btn").forEach(btn => btn.addEventListener("click", openModal));
        }
    }

    // 모달 열기
    function openModal(e) {
        var event = e.currentTarget.dataset;
        var itemsList = []; 
        var key = event.key;
        var cat = event.cat;
        currentEdit = configKeys.find(i => i.key === key);
        $("#modalTitle").text(`${key} 설정 변경`);
        $("#modalCurrent").text("불러오는 중...");
        kvMap = {};

        switch(currentEdit.dataType) {
            case "memoryunit":
                $(".alert")[0].classList.remove("d-none");
                $(".alert > #alertMsg")[0].innerText = 
`# 1k => 1000 bytes
# 1kb => 1024 bytes
# 1m => 1000000 bytes
# 1mb => 1024*1024 bytes
# 1g => 1000000000 bytes
# 1gb => 1024*1024*1024 bytes`;
                break;
            default:
                $(".alert")[0].classList.add("d-none");
        }
        editModal.show();

        // 조회
        fetch("/v1/management/settings/config/" + key)
            .then(res=> {
                if (!res.ok) {
                    editModal.hide();
                    console.error(res.statusText);
                    alert("관리자에게 문의하세요");
                }
                return res.json();
            })
            .then(data=> {
                var currentKey = Object.keys(data.result)[0];
                var currentVal = data.result[currentKey];
                var viewCurrentVal = data.result[currentKey];
                if (!isNaN(viewCurrentVal)) {
                    viewCurrentVal = numberWithCommas(currentVal);
                }
                
                switch(currentEdit.dataType) {
                    case "memoryunit":
                        $("#modalCurrent").text(formatRedisMemoryValue(currentVal));
                        break;
                    default:
                        $("#modalCurrent").text(viewCurrentVal);
                }

                if (currentEdit.dataType === "keyvalue") 
                try { 
                    kvMap = JSON.parse(currentVal);
                } catch {
                    $("#modalCurrent").text("-");
                };
                renderModalInput(currentEdit, currentVal);
                
            })
            .catch(err=> {
                console.error(err);
                alert("관리자에게 문의하세요:" + err);
            	$("#modalCurrent").text("-");
                editModal.hide();
            });
	}
// 입력 컴포넌트 생성
	function renderModalInput(cfg, curr) {
        var cont = document.getElementById("modalInputContainer");
	    cont.innerHTML = "";
        var html = "";
        switch(cfg.dataType) {
            case "integer":
                html = `<input id="modalInput" type="number" step="1" class="form-control" value="${curr}">`;
                break;
            case "dropdown":
                html = `<select id="modalInput" class="form-select">${cfg.options.map(o=>`<option value="${o}"${o===curr?' selected':''}>${o}</option>`).join('')}</select>`;
                break;
            case "toggle":
                html = `<div class="form-check form-switch"><input id="modalInput" class="form-check-input" type="checkbox"${curr==='yes'?' checked':''}><label class="form-check-label">${cfg.description}</label></div>`;
                break;
            case "password":
                html = `<input id="modalInput" type="password" class="form-control" placeholder="새 비밀번호">`;
                break;
            case "string":
                html = `<textarea id="modalInput" class="form-control" rows="3">${curr}</textarea>`;
                break;
            case "keyvalue":
                html = `<div id="kvContainer" class="mb-2"></div><button id="addKvBtn" class="btn btn-sm btn-outline-secondary mb-3">+ 추가</button>`;
                break;
            case "memoryunit":
                html = `<input id="modalInput" type="text" class="form-control" value="${getRedisMemoryInputValue(curr)}">`;
                break;
        }
        cont.innerHTML = html;
        if (cfg.dataType === "keyvalue") initKeyValue();
    }

	// keyvalue 초기화 및 렌더
    function initKeyValue() {
        var kvCont = document.getElementById("kvContainer")
        var addBtn = document.getElementById("addKvBtn");
        addBtn.onclick = () => { 
            kvMap[""] = ""; renderKV();
        };

        function renderKV() {
            kvCont.innerHTML = "";
            Object.entries(kvMap).forEach(([k,v]) => {
                var row = document.createElement("div");
                row.className = "d-flex mb-2";
                row.innerHTML = `<input class="form-control me-2" data-key="key" value="${k}" placeholder="명령어">` +
                                `<input class="form-control me-2" data-key="value" value="${v}" placeholder="새 이름">` +
                                `<button class="btn btn-sm btn-danger">-</button>`;
                row.querySelector("button").onclick=()=>{
                    delete kvMap[k];
                    renderKV();
                };
                row.querySelectorAll("input").forEach(inp=>{
                    inp.oninput=()=>{
                        const newKey=row.querySelector("[data-key=key]").value;
                        const newVal=row.querySelector("[data-key=value]").value;
                        delete kvMap[k]; if(newKey) kvMap[newKey]=newVal; renderKV();
                    };
                });
                kvCont.appendChild(row);
            });
        }
        renderKV();
    }

    function refreshCurrentConfigValue(config) {
        return fetch("/v1/management/settings/config/" + config.key)
            .then(res => {
                if (!res.ok) {
                    throw new Error(res.statusText);
                }
                return res.json();
            })
            .then(data => {
                if (!data.result || !Object.prototype.hasOwnProperty.call(data.result, config.key)) {
                    throw new Error("Invalid config response");
                }

                var currentValue = data.result[config.key];
                config.currentValue = currentValue;
                var currentValueElement = document.querySelector(`.current-value[data-key="${config.key}"]`);
                if (currentValueElement) {
                    currentValueElement.textContent = formatConfigValue(config, currentValue);
                }
            });
    }

    // 저장 처리
    document.getElementById("saveBtn").onclick=()=>{
        var val;
        if (currentEdit.dataType === "toggle") val = document.getElementById("modalInput").checked ? "yes":"no";
        else if (currentEdit.dataType === "keyvalue") val = JSON.stringify(kvMap);
        else val = document.getElementById("modalInput").value;
        
        if (val === "" || val === null || val === undefined) {
            alert("값을 입력해주세요");
            return;
        }
        
        if (currentEdit.dataType === "integer") {
            val = val.trim();
            if (!/^-?\d+$/.test(val)) {
                alert("정수만 입력 가능합니다.");
                return;
            }
        }

        if (currentEdit.key === 'maxmemory') {
            val = val.trim();
            var memoryPattern = /^\d+(k|kb|m|mb|g|gb)?$/i;
            if (!memoryPattern.test(val)) {
                alert("memory 단위의 값이 아닙니다. 다시 입력해주세요.");
                return;
            }
        }
        //모달 창에 id, password 가 남아있어 지움
        document.getElementById("username").value = "";
        document.getElementById("password-input").value = "";
        loginModal.show();
	};

    // 로그인 처리
    document.getElementById("saveLoginBtn").onclick=()=>{
        var val;
        if (currentEdit.dataType === "toggle") val = document.getElementById("modalInput").checked ? "yes":"no";
        else if (currentEdit.dataType === "keyvalue") val = JSON.stringify(kvMap);
        else val = document.getElementById("modalInput").value;
        if (currentEdit.key === "maxmemory") val = val.trim();

        var id = document.getElementById("username").value;
        var pwd = document.getElementById("password-input").value;

        if (id === "" || id === null || id === undefined) {
            alert("아이디를 입력해주세요");
            return;
        }
        if (pwd === "" || pwd === null || pwd === undefined) {
            alert("비밀번호를 입력해주세요");
            return;
        }

        var loginData = new URLSearchParams();
        loginData.append("loginId", id);
        loginData.append("loginPassword", pwd);

        //로그인 검증
        fetch("/v1/management/login", {
            method:"POST",
            headers:{"Content-Type":"application/x-www-form-urlencoded"},
            body: loginData.toString()
        })
        .then(res => res.json())
        .then(loginRes => {
            if (loginRes.hasOwnProperty("result") && loginRes.result.toUpperCase() === "OK") {
                //저장
                var saveData = new URLSearchParams();
                saveData.append("value", val);
                fetch("/v1/management/settings/config/" + currentEdit.key, {
                    method:"PUT",
                    headers:{"Content-Type":"application/x-www-form-urlencoded"},
                    body: saveData.toString()
                })
                .then(res => res.json())
                .then(saveRes => {
                    if (saveRes.hasOwnProperty("result") && saveRes.result.toUpperCase() === "OK") {
                        refreshCurrentConfigValue(currentEdit)
                            .then(() => {
                                loginModal.hide();
                                editModal.hide();
                                alert("저장 성공하였습니다");
                            })
                            .catch(err => {
                                alert("저장 후 조회 실패하였습니다: " + err);
                            });
                    } else {
                        alert("저장 실패하였습니다");
                    }
                })
                .catch(err => {
                    alert("저장 실패하였습니다: " + err)
                });
            } else {
                alert("로그인 인증이 실패하였습니다");
                return;
            }
        })
        .catch(err => {
            alert("로그인 인증이 실패하였습니다");
            console.error("로그인 인증이 실패하였습니다: ", err)
        });
	};

    // 검색이벤트	
    document.getElementById("searchInput").oninput = () => {
        var cat = document.querySelector("#categoryTabs .nav-link.active").dataset.cat;
        renderTable(cat,document.getElementById("searchInput").value);
    };

    // 초기화
    document.getElementById("resetBtn").onclick = () => {
        document.getElementById("searchInput").value = "";
        renderTable();
    };

	// 상단 Category
    function setCategory(data){
        var categories = data.map(item => item.category);
        var uniqueCategory = [...new Set(categories)];
        var ul = document.getElementById("categoryTabs");
        var html = `<li class="nav-item"><button type="button" class="nav-link active" data-cat="All">전체</button></li>`;
        uniqueCategory.forEach(category => {
            html += `<li class="nav-item"><button type="button" class="nav-link" data-cat="${category}">${category}</button></li>`;
        })
        ul.innerHTML = html;

		// 탭 & 검색 이벤트
        ul.addEventListener("click", e => {
            var tab = e.target.closest(".nav-link");
            if(tab && ul.contains(tab)) {
                document.querySelectorAll("#categoryTabs .nav-link").forEach(t=>t.classList.remove("active")); 
                tab.classList.add("active");
                renderTable(tab.dataset.cat, document.getElementById("searchInput").value);
            }
        })
    }
    
    // 천단위 표시
    function numberWithCommas(x) {
        return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
	
	// 조회
    function getList() {
        fetch("/v1/management/settings/configs")
            .then(res => { 
                return res.json();
            })
            .then(data => {
                setCategory(data.configKeys);
                configKeys = data.configKeys;
                renderTable("All");
            })
            .catch(err =>alert("조회 실패 되었습니다: " + err));
    }

    function initTable() {
        // Table thead 설정
        var tr = document.createElement("tr");
        var td = document.createElement("td");
        td.textContent = "데이터가 없습니다.";
        td.style.textAlign = "center";
        td.colSpan = 4;
        tr.appendChild(td);
        tableBody.appendChild(tr);
    }

	// 처음 로드되었을 떄 
    initTable();
	getList();
	
</script>
